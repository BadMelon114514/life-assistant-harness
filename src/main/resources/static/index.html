<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活助理 Harness</title>
    <style>
        /* ============================================
           Material Design 3 风格
           色彩: Indigo 主色 + Material 语义色
           组件: Card / Button / Chip / Dialog / Elevation
           ============================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            /* 设计语言：DeepSeek Harness 风格（浅色）——近白底 + 浅灰分区 + 蓝色强调 + 大圆角 + 极简无边框 */
            --primary: #4176e6;            /* Harness 强调蓝 */
            --primary-dark: #3563c9;
            --primary-container: #e4edfd;  /* 选中/悬停浅蓝底 */
            --on-primary: #ffffff;
            --secondary: #6f8ce0;
            --bg: #fafbfc;                 /* 页面背景（浅灰白） */
            --card: #ffffff;
            --surface-2: #f5f6f7;          /* 分区灰（气泡/表头/面板底） */
            --text: #0f1115;               /* 主文字（近黑） */
            --text-light: #61666b;         /* 次级文字 */
            --text-muted: #adb2b8;         /* 弱化文字 */
            --outline: rgba(0,0,0,.10);    /* 极细描边 */
            --border: rgba(0,0,0,.08);
            --green: #2f9e44;
            --green-bg: #e6f4ea;
            --orange: #e8590c;
            --orange-bg: #fff0e6;
            --red: #d6336c;
            --red-bg: #fdeef3;
            --blue: #1c7ed6;
            --blue-bg: #e7f3fc;
            --sidebar-bg: #f9fafb;         /* 侧栏：浅灰（Harness 图标栏同款） */
            --sidebar-active: #e4edfd;     /* 选中项：浅蓝底 */
            --sidebar-text: #0f1115;
            --sidebar-text-muted: #81858c;
            --elevation-1: 0 1px 2px rgba(15,17,21,.05), 0 1px 3px rgba(15,17,21,.06);
            --elevation-2: 0 2px 4px rgba(15,17,21,.06), 0 2px 8px rgba(15,17,21,.07);
            --elevation-3: 0 6px 16px rgba(15,17,21,.08), 0 4px 6px rgba(15,17,21,.05);
            --elevation-4: 0 12px 32px rgba(15,17,21,.12), 0 4px 8px rgba(15,17,21,.06);
            --sidebar-w: 232px;
            --content-max: 1180px;      /* 宽屏内容最大宽度：避免卡片被无限拉伸 */
            --code-bg: #f6f8fa;
            --ds-ease: cubic-bezier(.4, 0, .2, 1);
        }
        /* ---------- 深色模式 ---------- */
        [data-theme="dark"] {
            /* Harness 风格暗色：近黑底 + 深灰卡片 + 柔和蓝强调 */
            --primary: #6f9bf0;
            --primary-dark: #8ab4f8;
            --primary-container: #1f2c44;
            --on-primary: #0b0f19;
            --secondary: #93b0e8;
            --bg: #0f1115;
            --card: #17191d;
            --surface-2: #1f2126;
            --text: #e6e7ea;
            --text-light: #b6b9c0;
            --text-muted: #7d8189;
            --outline: rgba(255,255,255,.12);
            --border: rgba(255,255,255,.1);
            --green: #69db7c;
            --green-bg: #13261a;
            --orange: #ffa94d;
            --orange-bg: #2b2014;
            --red: #f783ac;
            --red-bg: #331522;
            --blue: #74c0fc;
            --blue-bg: #12293c;
            --sidebar-bg: #14161a;
            --sidebar-active: #1f2c44;
            --sidebar-text: #e6e7ea;
            --sidebar-text-muted: #7d8189;
            --elevation-1: 0 1px 2px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.4);
            --elevation-2: 0 2px 4px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.45);
            --elevation-3: 0 6px 16px rgba(0,0,0,.5), 0 4px 6px rgba(0,0,0,.35);
            --elevation-4: 0 12px 32px rgba(0,0,0,.6), 0 4px 8px rgba(0,0,0,.4);
            --code-bg: #1a1d23;
        }
        /* 深色下固定色适配（Harness 暗色） */
        [data-theme="dark"] .md-render pre { background: #1a1d23 !important; border-color: rgba(255,255,255,.1); }
        [data-theme="dark"] .md-render code { background: #26292f; }
        [data-theme="dark"] .md-render blockquote { color: #9aa0a8; }
        [data-theme="dark"] .collapsed-head { color: var(--text-light); }
        [data-theme="dark"] tr:hover td { background: #1a1d23; }
        [data-theme="dark"] .tag-gray { background: #26292f; color: #9aa0a8; }
        [data-theme="dark"] .toast { background: #26292f; color: #f2f3f5; }
        [data-theme="dark"] .md-render pre code { background: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            transition: background .2s var(--ds-ease), color .2s var(--ds-ease);
        }
        /* ---------- 侧边栏（Harness 风格：浅灰底 + 蓝色强调选中） ---------- */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            padding: 20px 0;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
            border-right: 1px solid var(--border);
            box-shadow: none;
        }
        .sidebar .logo {
            padding: 0 20px 20px;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px;
            letter-spacing: .3px;
            color: var(--sidebar-text);
        }
        .sidebar .logo .badge {
            width: 40px; height: 40px; border-radius: 12px;
            background: var(--sidebar-active); display: flex; align-items: center; justify-content: center;
            font-size: 20px; flex-shrink: 0;
            color: var(--primary);
            box-shadow: var(--elevation-1);
        }
        .sidebar nav { margin-top: 16px; flex: 1; overflow-y: auto; padding: 0 8px; }
        .sidebar nav a {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; margin-bottom: 4px;
            color: var(--sidebar-text-muted);
            text-decoration: none; font-size: 14px; cursor: pointer;
            border-radius: 12px;
            transition: background .2s var(--ds-ease), color .2s var(--ds-ease);
        }
        .sidebar nav a:hover { background: rgba(0,0,0,.04); color: var(--sidebar-text); }
        .sidebar nav a.active {
            background: var(--sidebar-active); color: var(--primary); font-weight: 600;
            box-shadow: none;
        }
        .sidebar nav a .ico { font-size: 19px; width: 22px; text-align: center; }
        .sidebar .status-bar {
            padding: 16px 20px; border-top: 1px solid var(--border);
            font-size: 12px; color: var(--sidebar-text-muted);
        }
        .sidebar .status-bar .dot {
            display:inline-block; width:9px; height:9px; border-radius:50%;
            background: var(--red); margin-right:6px; transition: all .3s;
        }
        .sidebar .status-bar .dot.online, #connStatus.online ~ * .dot { background: #2f9e44; }
        #connStatus.online { color: #2f9e44; }
        .sidebar .status-bar .theme-toggle {
            float: right; background: var(--surface-2); color: var(--sidebar-text-muted);
            border: 1px solid var(--border); border-radius: 999px; font-size: 15px;
            cursor: pointer; padding: 2px 9px; transition: all .2s var(--ds-ease);
        }
        .sidebar .status-bar .theme-toggle:hover { background: var(--sidebar-active); color: var(--primary); }
        #shutdownBtn { margin-left: 6px; }
        #shutdownBtn:hover { background: var(--red-bg); color: var(--red); }

        /* ---------- 主内容 ---------- */
        .main {
            margin-left: var(--sidebar-w);
            flex: 1;
            padding: 28px 36px;
            width: calc(100% - var(--sidebar-w));
            min-height: 100vh;
            min-width: 0;
        }
        /* 宽屏居中：内容区最大 1180px，两侧留白，阅读距离更舒适 */
        .main > * { width: 100%; max-width: var(--content-max); margin-left: auto; margin-right: auto; }
        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px;
            margin-bottom: 24px;
        }
        .page-header h1 { font-size: 24px; font-weight: 500; color: var(--text); letter-spacing: .2px; }
        .page-header .sub { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
        .badge-date {
            background: var(--card); border: 1px solid var(--outline);
            padding: 8px 16px; border-radius: 24px; font-size: 13px; color: var(--text-light);
            box-shadow: var(--elevation-1);
        }

        /* ---------- 卡片（Material Card） ---------- */
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: var(--elevation-1);
            border: 1px solid var(--border);
        }
        .card h3 { font-size: 16px; font-weight: 500; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; color: var(--text); }
        .chat-card { padding-bottom: 16px; }

        .grid { display: grid; gap: 20px; }
        /* 网格子项允许收缩：避免宽表格的 min-content 撑破 1fr 列（手机端横向溢出） */
        .grid > * { min-width: 0; }
        .card { min-width: 0; }
        .grid-2 { grid-template-columns: 1fr 1fr; }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }

        /* ---------- 统计卡片（Material Stat） ---------- */
        .stat-card {
            background: var(--card);
            border-radius: 16px; padding: 20px; position: relative;
            box-shadow: var(--elevation-1);
            transition: box-shadow .25s var(--ds-ease), transform .25s var(--ds-ease);
            border: 1px solid var(--border);
        }
        .stat-card:hover { box-shadow: var(--elevation-3); transform: translateY(-2px); }
        .stat-card .num { font-size: 30px; font-weight: 500; margin-top: 8px; color: var(--primary); }
        .stat-card .label { color: var(--text-muted); font-size: 13px; }
        .stat-card .stat-icon {
            position: absolute; top: 16px; right: 20px; font-size: 28px; opacity: .25;
        }

        /* ---------- 按钮（Material Button） ---------- */
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 9px 18px; border-radius: 20px;
            border: 1px solid var(--outline);
            background: transparent; color: var(--primary); font-size: 14px; font-weight: 500;
            cursor: pointer;
            transition: box-shadow .2s, background .2s, transform .1s;
            text-decoration: none;
            position: relative; overflow: hidden;
            text-transform: none; letter-spacing: .2px;
        }
        .btn:hover { background: var(--primary-container); box-shadow: var(--elevation-1); }
        .btn:active { transform: scale(.98); }
        .btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
        .btn-primary {
            background: var(--primary); border-color: var(--primary); color: var(--on-primary);
            box-shadow: var(--elevation-2);
        }
        .btn-primary:hover { background: var(--primary-dark); box-shadow: var(--elevation-3); color: #fff; }
        .btn-danger { color: var(--red); border-color: rgba(214,51,108,.35); }
        .btn-danger:hover { border-color: var(--red); background: var(--red-bg); }
        .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 16px; }

        /* ---------- 表单（Material Outlined） ---------- */
        input, select, textarea {
            width: 100%; padding: 12px 14px;
            border: 1.5px solid var(--outline);
            border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--card);
            color: var(--text);
            transition: border-color .2s, box-shadow .2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(65,118,230,.15);
        }
        label { display: block; font-size: 13px; color: var(--text-light); margin-bottom: 6px; font-weight: 500; }
        .form-group { margin-bottom: 18px; }
        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 46px; }
        .password-wrap .btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }

        /* ---------- 表格（Material Table） ---------- */
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 13px; border-bottom: 1px solid var(--outline); }
        th {
            color: var(--text-muted); font-weight: 600; font-size: 12px; letter-spacing: .5px;
            background: var(--surface-2);
        }
        tr:hover td { background: rgba(15,17,21,.03); }
        .task-cell { max-width: 200px; }

        /* ---------- 统一线条风图标（SVG sprite） ---------- */
        .ic {
            width: 19px; height: 19px;
            stroke: currentColor; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
            vertical-align: -4px; flex-shrink: 0;
        }
        .ic-sm { width: 15px; height: 15px; vertical-align: -2px; }
        .ic-lg { width: 26px; height: 26px; vertical-align: -6px; }
        button .ic { pointer-events: none; }

        /* ---------- 标签（Material Chip） ---------- */
        .tag {
            display: inline-block; padding: 4px 12px; border-radius: 999px;
            font-size: 12px; font-weight: 500; letter-spacing: .2px;
        }
        .tag-green { background: var(--green-bg); color: var(--green); }
        .tag-orange { background: var(--orange-bg); color: var(--orange); }
        .tag-red { background: var(--red-bg); color: var(--red); }
        .tag-gray { background: var(--surface-2); color: var(--text-muted); }
        .tag-blue { background: var(--blue-bg); color: var(--blue); }

        /* ---------- 进度条（Material Progress） ---------- */
        .progress-wrap { background: var(--surface-2); border-radius: 20px; height: 7px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--primary); border-radius: 20px; transition: width .4s ease; }
        .bar-green { background: var(--green); }

        /* ---------- 聊天（Material Chat） ---------- */
        .chat-box {
            height: clamp(300px, 46vh, 520px); min-height: 240px; overflow-y: auto;
            border-radius: 16px; padding: 18px;
            background: var(--surface-2); margin-bottom: 14px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,.06);
        }
        .msg { display: flex; margin-bottom: 16px; }
        .msg .avatar {
            width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 17px;
            background: var(--primary); color: var(--on-primary); margin-right: 10px;
            box-shadow: var(--elevation-2);
        }
        .msg.user { flex-direction: row-reverse; }
        .msg.user .avatar { background: var(--primary-container); color: var(--primary); margin-right: 0; margin-left: 10px; }
        .msg .bubble {
            max-width: 72%; padding: 12px 18px; border-radius: 18px;
            font-size: 14px; line-height: 1.7; white-space: pre-wrap;
            word-break: break-word; overflow-wrap: anywhere;
        }
        .msg.user .bubble {
            background: var(--primary); color: var(--on-primary);
            border-top-right-radius: 8px; box-shadow: var(--elevation-1);
        }
        .msg.bot .bubble {
            background: var(--surface-2); border: 1px solid transparent;
            border-top-left-radius: 8px; box-shadow: none;
        }
        .suggest {
            display: inline-block; background: var(--primary-container); color: var(--primary);
            padding: 5px 12px; border-radius: 18px; margin: 4px 4px 0 0; font-size: 13px;
            cursor: pointer; border: 1px solid transparent; transition: all .2s;
        }
        .suggest:hover { border-color: var(--primary); box-shadow: var(--elevation-1); }
        .typing span { animation: blink 1.2s infinite; }
        .typing span:nth-child(2) { animation-delay: .2s; }
        .typing span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0%,80%,100% {opacity:0;} 40% {opacity:1;} }

        .chat-input { display: flex; gap: 10px; }
        .chat-input input { flex: 1; min-width: 0; border-radius: 24px; padding-left: 18px; }
        .chat-input .btn { flex-shrink: 0; border-radius: 24px; }

        .hide { display: none !important; }
        .collapsed-reply { margin-top: 2px; }
        .collapsed-head {
            background: var(--surface-2); border-left: 3px solid var(--primary);
            padding: 8px 12px; border-radius: 10px; font-size: 13px; color: var(--text-light);
        }
        .collapsed-toggle {
            margin-top: 8px; font-size: 13px; color: var(--primary);
            background: var(--primary-container); border: 1px solid transparent;
            padding: 4px 12px; border-radius: 14px; cursor: pointer; transition: all .2s;
        }
        .collapsed-toggle:hover { border-color: var(--primary); box-shadow: var(--elevation-1); }
        .collapsed-body { margin-top: 8px; border-top: 1px dashed rgba(0,0,0,.12); padding-top: 8px; }
        /* Markdown 渲染样式（知识库 md 文档阅读 + 聊天气泡 Markdown 适配） */
        .md-render { white-space: normal; word-break: break-word; }
        /* 聊天气泡内：Markdown 内容直接用气泡背景，不嵌套白块 */
        .msg .bubble > .md-render { background: transparent; border: none; border-radius: 0; padding: 0; }
        .md-render h1, .md-render h2, .md-render h3 { margin: 14px 0 8px; color: var(--text); }
        .md-render h1 { font-size: 20px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .md-render h2 { font-size: 17px; }
        .md-render h3 { font-size: 15px; }
        .md-render p { margin: 6px 0; }
        .md-render ul, .md-render ol { margin: 6px 0; padding-left: 22px; }
        .md-render table { border-collapse: collapse; margin: 8px 0; display: block; max-width: 100%; overflow-x: auto; }
        .md-render th, .md-render td { border: 1px solid var(--border); padding: 6px 10px; font-size: 13px; }
        .md-render th { background: var(--surface-2); }
        .md-render code { background: var(--surface-2); padding: 2px 5px; border-radius: 6px; font-size: 12.5px; }
        .md-render pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; overflow-x: auto; }
        .md-render pre code { background: transparent; padding: 0; }
        .md-render blockquote { border-left: 3px solid var(--primary); margin: 8px 0; padding: 4px 12px; color: var(--text-muted); background: var(--surface-2); }
        .chat-stop-btn { margin-right: 8px; }
        /* 后台定时任务推送的横幅 */
        .scheduled-banner {
            background: linear-gradient(135deg, var(--primary), var(--blue, #1c7ed6));
            color: var(--on-primary, #fff); font-size: 12px; font-weight: 600;
            padding: 4px 10px; border-radius: 6px; display: inline-block; margin-bottom: 8px;
        }
        .warning-banner {
            background: var(--orange-bg); border-left: 4px solid var(--orange);
            color: var(--orange);
            padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px;
        }
        .warning-banner a { color: var(--primary); font-weight: 600; }
        .muted { color: var(--text-muted); font-size: 13px; }
        .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
        .flex-1 { flex: 1; }
        .mt { margin-top: 10px; }
        .center { text-align: center; }
        code { background: var(--surface-2); padding: 2px 6px; border-radius: 6px; font-size: 12px; color: var(--primary); }

        /* ---------- 上传区（Material Drop） ---------- */
        .drop-zone {
            border: 2px dashed var(--outline); border-radius: 16px;
            padding: 40px; text-align: center; cursor: pointer; transition: all .25s;
            background: var(--surface-2);
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary); background: var(--primary-container);
        }
        .drop-zone .big { font-size: 44px; margin-bottom: 8px; opacity: .55; }
        .drop-zone .dz-title { font-size: 15px; font-weight: 500; }

        .search-box { position: relative; }
        .search-ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: .5; }
        .search-box input { padding-left: 38px; border-radius: 24px; }

        /* ---------- 任务看板 ---------- */
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
        .board-col { background: var(--surface-2); border-radius: 16px; padding: 12px; min-height: 300px; }
        .board-head {
            display: flex; justify-content: space-between; align-items: center;
            padding: 4px 6px 12px; font-weight: 600; font-size: 14px; color: var(--text);
        }
        .board-head .count {
            background: var(--card); padding: 2px 10px; border-radius: 12px; font-size: 12px; color: var(--text-muted);
        }
        .task-card {
            background: var(--card);
            border-radius: 12px;
            padding: 14px; margin-bottom: 10px;
            box-shadow: var(--elevation-1);
            transition: box-shadow .2s var(--ds-ease);
        }
        .task-card:hover { box-shadow: var(--elevation-3); }
        .dep { font-size: 12px; color: var(--orange); background: var(--orange-bg); padding: 3px 8px; border-radius: 6px; }
        .empty { color: var(--text-muted); text-align: center; padding: 24px 0; font-size: 13px; }

        /* ---------- 日志（Material Terminal） ---------- */
        .log-box {
            max-height: 280px; overflow-y: auto; font-size: 13px;
            background: #1d2333; border-radius: 12px; padding: 14px 16px; color: #cbd5e1;
            font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        }
        .log-line { padding: 2px 0; }
        .log-time { color: #64748b; margin-right: 8px; }
        .log-level { font-weight: 600; margin-right: 6px; }
        .lv-info { color: #90caf9; }
        .lv-warn { color: #ffcc80; }
        .lv-error { color: #ef9a9a; }
        .log-src { color: #b39ddb; margin-right: 4px; }

        /* ---------- 模态框（Material Dialog） ---------- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center;
            z-index: 1000; animation: fadeIn .18s ease;
            backdrop-filter: blur(2px);
        }
        .modal {
            background: var(--card); border-radius: 20px; width: 480px; max-width: 92vw;
            max-height: 88vh; display: flex; flex-direction: column;
            box-shadow: var(--elevation-4); animation: slideUp .22s cubic-bezier(.2,.8,.2,1);
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 24px 12px; border-bottom: 1px solid var(--outline);
        }
        .modal-header h3 { font-size: 18px; font-weight: 500; margin: 0; color: var(--text); }
        .modal-close {
            background: none; border: none; font-size: 26px; color: var(--text-muted);
            cursor: pointer; line-height: 1; border-radius: 50%; width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            transition: background .2s;
        }
        .modal-close:hover { background: var(--surface-2); color: var(--text); }
        .modal-body { padding: 20px 24px; overflow-y: auto; }
        .modal-footer {
            display: flex; justify-content: flex-end; gap: 10px;
            padding: 12px 24px 20px; border-top: 1px solid var(--outline);
        }
        @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
        @keyframes slideUp { from {opacity:0; transform: translateY(20px) scale(.98);} to {opacity:1; transform:none;} }

        /* ---------- Toast（Material Snackbar） ---------- */
        .toast {
            position: fixed; top: 20px; right: 20px;
            background: #0f1115; color: #f2f3f5;
            padding: 14px 22px; border-radius: 12px; font-size: 14px; z-index: 2000;
            transform: translateY(-80px); opacity: 0; transition: all .3s var(--ds-ease);
            max-width: 340px; box-shadow: var(--elevation-4);
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* ---------- 响应式 ---------- */
        @media (max-width: 900px) {
            .grid-4 { grid-template-columns: repeat(2, 1fr); }
            .grid-3 { grid-template-columns: 1fr; }
            .grid-2 { grid-template-columns: 1fr; }
            .board { grid-template-columns: 1fr; }
            .sidebar { width: 64px; padding: 14px 0; }
            .sidebar .logo { padding: 0 0 14px; justify-content: center; }
            .sidebar .logo .badge { width: 38px; height: 38px; border-radius: 10px; }
            .sidebar .logo span:last-child, .sidebar nav a .nav-label { display: none; }
            .sidebar nav { padding: 0 6px; }
            .sidebar nav a { justify-content: center; padding: 12px 0; }
            .sidebar nav a .ico { width: auto; }
            /* 小屏保留主题切换与关闭按钮，连接状态只留指示点 */
            .sidebar .status-bar { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; }
            .sidebar .status-bar #connStatus { display: none; }
            .sidebar .status-bar .dot { margin-right: 0; }
            .sidebar .status-bar .theme-toggle { float: none; }
            #shutdownBtn { margin-left: 0; }
            .main { margin-left: 64px; width: calc(100% - 64px); padding: 20px; }
        }
        @media (max-width: 640px) {
            :root { --sidebar-w: 56px; }
            .sidebar { width: 56px; }
            .main { margin-left: 56px; width: calc(100% - 56px); padding: 14px 12px 24px; }
            .page-header { margin-bottom: 16px; gap: 8px; }
            .page-header h1 { font-size: 20px; }
            .badge-date { padding: 6px 12px; font-size: 12px; }
            .card { padding: 16px; border-radius: 14px; }
            .stat-card { padding: 16px; }
            .stat-card .num { font-size: 24px; }
            .chat-box { height: clamp(260px, 44vh, 420px); padding: 12px; }
            .msg .bubble { max-width: 86%; padding: 10px 14px; }
            .chat-input { gap: 8px; }
            .toast { right: 12px; top: 12px; max-width: calc(100vw - 24px); padding: 12px 16px; }
            .modal { width: 94vw; max-height: 90vh; }
            .drop-zone { padding: 24px 14px; }
            .log-box { font-size: 12px; padding: 10px 12px; }
            /* 七列宽表在手机上内部横向滚动，页面本身不溢出 */
            .card > table { display: block; width: 100%; max-width: 100%; overflow-x: auto; white-space: nowrap; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
    </style>
